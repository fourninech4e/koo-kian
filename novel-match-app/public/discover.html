<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ค้นหาคู่เขียน — คู่เขียน</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <a href="/discover.html" class="wordmark">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4c-4 0-9 2-12 5-2 2-3 5-3 8 0 1 0 2 1 3 3-1 6-2 8-4 3-3 5-8 5-12 0-.3 0-.1 1 0z"/><path d="M9.5 14.5L4 20"/></svg>
      คู่เขียน
    </a>
    <div class="nav-links">
      <span class="nav-user" data-nav-user></span>
      <a href="/discover.html" class="active">ค้นหาคู่เขียน</a>
      <a href="/matches.html">คู่ที่แมตช์</a>
      <a href="/feed.html">เรื่องทั้งหมด</a>
      <a href="/profile.html">โปรไฟล์</a>
      <a href="#" id="logoutLink">ออกจากระบบ</a>
    </div>
  </div>

  <div class="page">
    <div class="page-header">
      <h1>ค้นหาคู่เขียน</h1>
      <p>ปัดขวาถ้าอยากชวนเขียนนิยายด้วยกัน ปัดซ้ายถ้ายังไม่ใช่ ตัวเลขวงกลมคือความเข้ากันได้ด้านสไตล์การเขียน</p>
    </div>

    <div class="deck-wrap" id="deckWrap">
      <div class="loading-text">กำลังโหลด...</div>
    </div>

    <div class="swipe-actions" id="actionButtons" style="display:none;">
      <button class="round-btn pass" id="btnPass" aria-label="ข้าม">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <button class="round-btn like" id="btnLike" aria-label="ถูกใจ">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4c-4 0-9 2-12 5-2 2-3 5-3 8 0 1 0 2 1 3 3-1 6-2 8-4 3-3 5-8 5-12 0-.3 0-.1 1 0z"/><path d="M9.5 14.5L4 20"/></svg>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="matchModal">
    <div class="match-modal">
      <div class="flourish">✦ ✦ ✦</div>
      <h2>จับคู่กันแล้ว!</h2>
      <p id="matchText">คุณกับ ... ถูกใจกันทั้งคู่ ลองเริ่มเขียนนิยายด้วยกันดูสิ</p>
      <div class="actions">
        <a href="/matches.html" class="btn btn-primary">ไปเริ่มเขียนนิยาย</a>
        <button class="btn btn-ghost" id="closeModal">ปัดต่อก่อน</button>
      </div>
    </div>
  </div>

<script src="/js/api.js"></script>
<script src="/js/discover.js"></script>
</body>
</html>
