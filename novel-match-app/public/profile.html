<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>โปรไฟล์ — คู่เขียน</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <a href="/discover.html" class="wordmark">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4c-4 0-9 2-12 5-2 2-3 5-3 8 0 1 0 2 1 3 3-1 6-2 8-4 3-3 5-8 5-12 0-.3 0-.1 1 0z"/><path d="M9.5 14.5L4 20"/></svg>
      คู่เขียน
    </a>
    <div class="nav-links">
      <span class="nav-user" data-nav-user></span>
      <a href="/discover.html">ค้นหาคู่เขียน</a>
      <a href="/matches.html">คู่ที่แมตช์</a>
      <a href="/feed.html">เรื่องทั้งหมด</a>
      <a href="/profile.html" class="active">โปรไฟล์</a>
      <a href="#" id="logoutLink">ออกจากระบบ</a>
    </div>
  </div>

  <div class="page">
    <div class="page-header">
      <h1>โปรไฟล์นักเขียน</h1>
      <p>ข้อมูลตรงนี้ — โดยเฉพาะแนวที่ชอบกับตัวอย่างงานเขียน — คือสิ่งที่ระบบใช้คำนวณความเข้ากันได้กับคนอื่น</p>
    </div>

    <div id="saveMsg" class="form-error" style="background:#E4EEE1;border-color:#C3D8BC;color:#3F5A38;"></div>

    <form id="profileForm">
      <div class="field">
        <label>ชื่อที่แสดง</label>
        <input type="text" id="displayName" maxlength="40" />
      </div>
      <div class="field">
        <label>แนะนำตัวสั้น ๆ</label>
        <textarea id="bio" rows="3" maxlength="300" placeholder="เล่าสั้น ๆ ว่าคุณชอบเขียนแนวไหน สไตล์แบบไหน"></textarea>
      </div>
      <div class="field">
        <label>แนวที่ชอบเขียน (เลือกได้หลายอัน)</label>
        <div class="chip-group" id="genreChips"></div>
      </div>
      <div class="field">
        <label>ตัวอย่างงานเขียนของคุณ</label>
        <textarea id="sample" rows="8" maxlength="3000" placeholder="วางย่อหน้าจากงานเขียนของคุณตรงนี้ ยิ่งเป็นสไตล์จริง ๆ ของคุณ ระบบก็ยิ่งจับคู่ได้แม่นขึ้น"></textarea>
        <div class="helper-text">ระบบจะดูความยาวประโยค ความยาวคำ และความหลากหลายของคำศัพท์ เพื่อเทียบสไตล์กับนักเขียนคนอื่น</div>
      </div>
      <div class="save-bar">
        <button type="submit" class="btn btn-primary">บันทึกโปรไฟล์</button>
      </div>
    </form>
  </div>

<script src="/js/api.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
